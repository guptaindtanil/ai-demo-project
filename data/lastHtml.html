
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>JSON to HTML Table</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
        }
        table {
          width: 60%;
          border-collapse: collapse;
          margin: 20px auto;
        }
        th, td {
          padding: 12px 16px;
          text-align: left;
          border: 1px solid #ccc;
        }
        th {
          background-color: #f2f2f2;
        }
        tr:nth-child(even) {
          background-color: #f9f9f9;
        }
        tr:nth-child(odd) {
          background-color: #e0f7fa;
        }
        tr:nth-child(3n) {
          background-color: #ffe0b2;
        }
        tr:hover {
          background-color: #e9e9ff;
        }
      </style>
    </head>
    <body>
      <h2 style="text-align:center;">User Data Table</h2>
      <table>
        <thead>
          <tr><th>Id</th><th>Name</th><th>Email</th><th>Age</th></tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>Alice</td><td>alice@example.com</td><td>28</td></tr><tr><td>2</td><td>Bob</td><td>bob@example.com</td><td>32</td></tr><tr><td>3</td><td>Charlie</td><td>charlie@example.com</td><td>24</td></tr>
        </tbody>
      </table>
    </body>
    </html>
